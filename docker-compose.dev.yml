services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tupastilla
      MYSQL_USER: tupastilla
      MYSQL_PASSWORD: tupastilla
      MYSQL_ROOT_PASSWORD: tupastilla-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ptupastilla-root"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  db-dev:
