name: CI/CD

on:
  push:
    branches: [Proyecto-TuPastilla]
    tags: ["v*"]
  pull_request:
    branches: [Proyecto-TuPastilla]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_DIR: tupastilla-api
  IMAGE: ghcr.io/${{ github.repository_owner }}/tupastilla-api

jobs:
  api:
    name: API · lint, tipos, pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tupastilla-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tupastilla-api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tupastilla-api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-cobertura
          path: tupastilla-api/coverage/

  android:
    name: Android · lint, pruebas, cobertura y APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas, cobertura y lint
        run: ./gradlew :app:testDebugUnitTest :app:verificarCoberturaAuth :app:lintDebug --console=plain
      - name: APK release
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reportes
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/lint-results-debug.*

  seguridad:
    name: Seguridad · secretos, CodeQL, imagen y DAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
      - name: Construir imagen de la API
        run: docker build -t tupastilla-api:ci ${{ env.API_DIR }}
      - name: Vulnerabilidades de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tupastilla-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Levantar la API para el escaneo dinámico
        run: |
          {
            echo "MYSQL_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "API_IMAGE=tupastilla-api:ci"
          } > .env
          docker compose up -d --wait api
          curl -fsS http://localhost:3000/health
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000/health
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ${{ env.API_DIR }}/openapi.yaml
          format: openapi
          cmd_options: -O http://localhost:3000
          allow_issue_writing: false
          artifact_name: zap-api-scan
      - name: Apagar
        if: always()
        run: docker compose down -v

  deploy:
    name: Despliegue · imagen a GHCR y APK a Releases
    needs: [api, android, seguridad]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/Proyecto-TuPastilla' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Proyecto-TuPastilla' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.API_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: APK de prueba
        run: |
          ./gradlew :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "TuPastilla-prueba-${GITHUB_REF_NAME//\//-}.apk"
      - name: APK release firmado
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TUPASTILLA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TUPASTILLA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUPASTILLA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Sin ANDROID_KEYSTORE_BASE64: se publica solo el APK de prueba"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TUPASTILLA_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease --console=plain -Ptupastilla.apiUrl="${{ vars.API_URL || 'https://api.tupastilla.example/' }}"
          cp app/build/outputs/apk/release/app-release.apk "TuPastilla-${GITHUB_REF_NAME//\//-}.apk"
      - name: Publicar en GitHub Releases
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: TuPastilla-*.apk
      - name: Resumen
        run: |
          {
            echo "### Desplegado"
            echo "- Imagen: \`${{ env.IMAGE }}\` (${{ steps.meta.outputs.version }})"
            echo "- APK de prueba en Releases: \`${{ steps.release.outputs.url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
